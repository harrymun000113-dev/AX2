<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Cafe | Home</title>
    <!-- CSS Link with Cache Buster -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body class="home-body">

    <!-- Top Navigation -->
    <nav class="top-menu cafe-nav">
        <div class="logo">OASIS CAFE</div>
        <div class="links">
            <a href="/" class="active">HOME</a>
            <a href="/menu">MENU</a>
        </div>
    </nav>

    <!-- HORIZONTAL BANNER (Inline style guarantees Flask finds the image!) -->
    <div class="banner-image" style="background-image: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('{{ url_for('static', filename='web_background.jpg') }}');"></div>

    <!-- Hero Section -->
    <div class="hero-section">
        <div class="hero-text">
            <h1>Slow coffee, <br>warm music, <br>robot service.</h1>
            <p>Click the turntable photo to set the lo-fi vibe. Chat with our bot on the bottom left for service.</p>
        </div>
        
        <!-- 3D Interactive Vinyl Image & Audio Player -->
        <div class="vinyl-stage">
            <div class="player-container">
                <img src="{{ url_for('static', filename='turntable.png') }}" id="vinyl-img" class="tilt-3d" alt="Turntable">
                
                <!-- Native Audio Widget -->
                <audio id="lofi-player" controls>
                    <!-- Make sure you put a file named 'lofi.mp3' in your static folder! -->
                    <source src="{{ url_for('static', filename='lofi.mp3') }}" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
            </div>
        </div>
    </div>

    <!-- 3D Robot Chatbot -->
    <div id="robot-container">
        <img src="{{ url_for('static', filename='image_05efab_2.png') }}" id="robot-avatar" class="tilt-3d" alt="Robot" onclick="toggleChat()">

        <div id="chat-window" class="hidden">
            <div class="chat-header">
                Oasis Bot 🤖
                <button onclick="toggleChat()">✖</button>
            </div>
            <div id="chat-messages" class="chat-messages">
                <div class="msg bot-msg">Hi! How can I help you? Need some tissues?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Ask for tissues...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // --- 3D TILT EFFECT LOGIC ---
        const tiltElements = document.querySelectorAll('.tilt-3d');
        tiltElements.forEach(el => {
            el.addEventListener('mousemove', (e) => {
                const rect = el.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -15; 
                const rotateY = ((x - centerX) / centerX) * 15;
                
                el.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
            });

            el.addEventListener('mouseleave', () => {
                el.style.transform = `perspective(800px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            });
        });

        // --- NATIVE AUDIO LOGIC ---
        const audioPlayer = document.getElementById('lofi-player');
        const vinylImg = document.getElementById('vinyl-img');

        // Clicking the turntable image plays/pauses the audio widget
        vinylImg.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
            } else {
                audioPlayer.pause();
            }
        });

        // Sync the glowing effect with the audio player state
        audioPlayer.addEventListener('play', () => {
            vinylImg.style.boxShadow = "0 0 40px rgba(255, 200, 100, 0.7)";
        });
        audioPlayer.addEventListener('pause', () => {
            vinylImg.style.boxShadow = "0 15px 35px rgba(0,0,0,0.2)";
        });

        // --- CHATBOT LOGIC ---
        function toggleChat() { document.getElementById('chat-window').classList.toggle('hidden'); }
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            appendMessage(text, 'user-msg');
            input.value = '';
            const loadingId = appendMessage("...", 'bot-msg');

            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById(loadingId).remove();
                appendMessage(data.reply, 'bot-msg');
            })
            .catch(() => {
                document.getElementById(loadingId).remove();
                appendMessage("Error connecting.", 'bot-msg');
            });
        }
        function appendMessage(text, className) {
            const chatMessages = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${className}`;
            msgDiv.textContent = text;
            msgDiv.id = 'msg-' + Date.now();
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return msgDiv.id;
        }
        document.getElementById('chat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
