<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Secondhand Resell Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F5F5F7;
            color: #1D1D1F;
            margin: 0; padding: 50px;
        }
        h1 { font-weight: 600; text-align: center; margin-bottom: 40px; }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px; max-width: 800px; margin: auto;
        }
        .card {
            background: #FFFFFF;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            text-align: center; transition: transform 0.2s ease;
        }
        .card:hover { transform: translateY(-5px); }
        h3 { margin-top: 0; }
        p { color: #86868B; font-size: 14px; margin-bottom: 20px; }
        button {
            background-color: #000000; color: #FFFFFF;
            border: none; border-radius: 8px;
            padding: 12px 24px; font-size: 16px;
            cursor: pointer; font-weight: 500; width: 100%;
        }
        button:hover { background-color: #333333; }
    </style>
</head>
<body>
    <h1> Secondhand Resell</h1>
    <div class="dashboard">
        <!-- 1. 당근마켓 -->
        <div class="card">
            <h3>1. 당근마켓 반자동</h3>
            <p>알림 확인 후 채팅 템플릿 전송</p>
            <button onclick="runTask('/api/danggeun')">실행하기</button>
        </div>
        <!-- 2. 리사이징 -->
        <div class="card">
            <h3>2. 사진 리사이징</h3>
            <p>부품별(L, R, M) 자동 규격화</p>
            <button onclick="runTask('/api/resize')">실행하기</button>
        </div>
        <!-- 3. 번개장터 -->
        <div class="card">
            <h3>3. 번장 자동 업로드</h3>
            <p>리사이징된 사진으로 자동 등록</p>
            <button onclick="runTask('/api/bunjang')">실행하기</button>
        </div>
        <!-- 4. 구글 시트 -->
        <div class="card">
            <h3>4. 재고/수익 동기화</h3>
            <p>스프레드시트에 자동 기록 및 계산</p>
            <button onclick="runTask('/api/sheet')">실행하기</button>
        </div>
    </div>

    <script>
        function runTask(endpoint) {
            fetch(endpoint, { method: 'POST' })
                .then(response => response.json())
                .then(data => alert(data.message))
                .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
